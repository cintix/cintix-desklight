; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-C3 Super Mini (wireless desk light)
; NOTE: copy include/config.example.h to include/config.h and set your
; WiFi credentials + LED pin/count before uploading.
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; Networking/on-device web are paused: the UI is hosted by the host
; service (host/desklight_service.py) which talks over USB serial.
; The src/network and src/web modules are kept on disk but excluded
; from the build - re-enable by removing these two lines.
build_src_filter = +<*> -<network> -<web>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc
lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0
